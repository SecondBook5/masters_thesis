name: One-use JHU ETD finalization

# Run only on the dedicated finalization branch.
on:
  push:
    branches:
      - jhu-etd-finalization

# Allow this one-use workflow to commit the validated source changes back to its branch.
permissions:
  contents: write

jobs:
  finalize-and-build:
    # Use a standard Linux runner for deterministic source patching and Git operations.
    runs-on: ubuntu-latest

    steps:
      # Check out the exact branch commit that triggered this run.
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Apply only the audited source and bibliography corrections.
      - name: Apply deterministic ETD fixes
        run: python tools/etd_finalize.py

      # Compile the complete thesis after patching; a LaTeX failure blocks the commit.
      - name: Compile thesis
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00-main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -shell-escape

      # Require a non-empty compiled PDF before accepting the source edits.
      - name: Verify compiled PDF exists
        run: test -s 00-main.pdf

      # Remove the temporary automation so it does not remain in the thesis repository.
      - name: Remove one-use helper
        run: git rm tools/etd_finalize.py .github/workflows/etd-finalize.yml

      # Commit only after source patching and the complete LaTeX build both succeed.
      - name: Commit validated production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 08-chapter-3.tex 13-appendix-C.tex thesis.bib
          git diff --cached --check
          git commit -m "Fix remaining JHU ETD production defects [skip ci]"
          git push origin HEAD:jhu-etd-finalization
